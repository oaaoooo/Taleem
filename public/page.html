<script src="/js/layout.js"></script>
<script>
(async () => {
  const k = new URLSearchParams(location.search).get('k') || 'terms';
  await shell('', '<div class="card"><div id="pgBody"><p class="muted">جاري التحميل...</p></div></div>');
  const j = await api('/api/page/' + encodeURIComponent(k));
  $('pgBody').innerHTML = j.ok
    ? `<h2 style="margin-top:0">${esc(j.title)}</h2><div class="legal-body">${esc(j.body)}</div>`
    : `<p>${esc(j.error || 'غير موجود')}</p>`;
  document.title = (j.ok ? j.title + ' | ' : '') + (S ? S.academy_name : '');
})();
</script>
